<script language="javascript" type="text/javascript" src="/sketch/CP2/complex.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/CP2.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/graphicsWindow.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/pointScheduler.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/CP2CurveVisualizer.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/ellipticCurve.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/complexSelector.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/polynomial.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/triangleCoords.js"></script>
<script language="javascript" type="text/javascript" src="/sketch/CP2/almost_toric_main.js"></script>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<style type="text/css">
  .mobileShow {
    display: none;
  }

  /* Smartphone Portrait and Landscape */
  @media only screen and (min-device-width : 320px) and (max-device-width : 700px) {
    .mobileShow {
      display: inline;
    }
  }
</style>

<div class="mobileShow">
  <h2>Does not work on mobile! please play on desktop sorry</h2>
</div>

<style>
  h1 {
    margin-top: -5rem;
    /* pull 1rem upward */
    margin-bottom: 0.5rem;
    /* adjust spacing below as needed */
  }
</style>
<h1 class="text-center">Shadows of curves in $\mathbb{CP}^2$</h1>

<div class="container mt-3">
  <!-- Canvas Row -->
  <div class="row">
    <div class="col-12 text-center">
      <div class="container" style="
          margin-top:0% ;
          margin-bottom:0% ;
          position: relative;
          ">
        <div class="sketch" id="almost_toric_sketch"></div>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <!-- LEFT CARD -->
    <div class="col-md-6 mb-2">
      <div class="card shadow-sm">
        <div class="card-body">
          Curve: <span id="curveEquation"></span>
          <!-- <input type="text" class="form-control" id="inputCoefs" value=""> -->
          <br>
          <!-- Degree Slider -->
          <label for="degreeSlider" class="form-label">Degree: <span id="degreeValue">3</span></label>
          <input type="range" class="form-range" id="degreeSlider" min="1" max="5" defaultUIState>

          <!-- Real Coefficients Checkbox -->
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="realCoefs" checked="true">
            <label class="form-check-label" for="toggleRealCoeff">Real coefficients</label>
          </div>

          <!-- Symmetrize coordinates checkbox-->
          <div class="form-check" id="symmetrizeContainer" style="display:block;">
            <input class="form-check-input" type="checkbox" id="symmetrize">
            <label class="form-check-label" for="symmetrize">
              Symmetric inputs
            </label>
          </div>



        </div>
      </div>
    </div>

    <!-- RIGHT CARD -->
    <div class="col-md-6 mb-2">
      <div class="card shadow-sm">
        <div class="card-body">
          <!--<h5 class="card-title">Display Panel</h5> -->

          <div class="row text-center">


          <!-- Real Curve Checkbox -->
          <div class="form-check" id="realCurveContainer" style="display:block;">
            <input class="form-check-input" type="checkbox" id="realCurve">
            <label class="form-check-label" for="realCurve">
              Show real curve
            </label>
          </div>

        </div>
      </div>
    </div>

  </div>



</div>

</html>
